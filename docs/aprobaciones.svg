<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
  <title id="t">Cómo se aprueban los permisos</title>
  <desc id="d">Un agente pide ejecutar un comando; el hook PreToolUse llega al backend; las reglas deny y allow deciden solas; lo demás va a la bandeja donde el usuario aprueba o rechaza; la decisión vuelve a Claude Code.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d7dae0; }
    .bg { fill: #0e0f12; }
    .step { fill: #16181d; stroke: #3a3e48; stroke-width: 1.5; animation: hl 10s infinite; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 12px; fill: #8a90a0; }
    .n { font-size: 12px; font-weight: 700; fill: #d77757; }
    .arrow { fill: none; stroke: #3a3e48; stroke-width: 2; }
    .rule { fill: #16181d; stroke: #4cc38a; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .deny { fill: #16181d; stroke: #ff7b7b; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ok { fill: none; stroke: #4cc38a; } .no { fill: none; stroke: #ff7b7b; }
    .btn { font-size: 12px; font-weight: 700; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: 2s; } .s3 { animation-delay: 4s; } .s4 { animation-delay: 6s; } .s5 { animation-delay: 8s; }
    @keyframes hl { 0%, 18% { stroke: #d77757; fill: #2a1f1b; stroke-width: 2.5; } 20%, 100% { stroke: #3a3e48; fill: #16181d; stroke-width: 1.5; } }
    @keyframes pop { 0%, 55%, 100% { opacity: .35; } 60%, 75% { opacity: 1; } }
    .fast { animation: pop 10s infinite; animation-delay: 0s; }
  </style>
  <rect class="bg" width="900" height="360" rx="14"/>

  <rect class="step s1" x="20" y="60" width="150" height="110" rx="12"/>
  <text class="n" x="34" y="84">1</text>
  <text class="h" x="95" y="108" text-anchor="middle">Un agente pide</text>
  <text class="s" x="95" y="128" text-anchor="middle">ejecutar un comando</text>
  <text class="s" x="95" y="148" text-anchor="middle">o editar un archivo</text>

  <rect class="step s2" x="195" y="60" width="150" height="110" rx="12"/>
  <text class="n" x="209" y="84">2</text>
  <text class="h" x="270" y="108" text-anchor="middle">Hook PreToolUse</text>
  <text class="s" x="270" y="128" text-anchor="middle">Claude Code avisa</text>
  <text class="s" x="270" y="148" text-anchor="middle">al backend por HTTP</text>

  <rect class="step s3" x="370" y="60" width="160" height="110" rx="12"/>
  <text class="n" x="384" y="84">3</text>
  <text class="h" x="450" y="108" text-anchor="middle">Reglas de la misión</text>
  <text class="s" x="450" y="128" text-anchor="middle">deny gana siempre;</text>
  <text class="s" x="450" y="148" text-anchor="middle">allow solo si es exacto</text>

  <rect class="step s4" x="555" y="60" width="160" height="110" rx="12"/>
  <text class="n" x="569" y="84">4</text>
  <text class="h" x="635" y="108" text-anchor="middle">Bandeja</text>
  <text class="s" x="635" y="128" text-anchor="middle">comando exacto y agente;</text>
  <text class="s" x="635" y="148" text-anchor="middle">tú decides</text>

  <rect class="step s5" x="740" y="60" width="140" height="110" rx="12"/>
  <text class="n" x="754" y="84">5</text>
  <text class="h" x="810" y="108" text-anchor="middle">Vuelve a Claude</text>
  <text class="s" x="810" y="128" text-anchor="middle">se ejecuta o se</text>
  <text class="s" x="810" y="148" text-anchor="middle">rechaza con motivo</text>

  <path class="arrow" d="M170 115 H195"/><path class="arrow" d="M345 115 H370"/><path class="arrow" d="M530 115 H555"/><path class="arrow" d="M715 115 H740"/>

  <!-- Ruta rápida -->
  <path class="arrow" d="M450 170 V215 H810 V170" stroke-dasharray="5 5"/>
  <rect class="rule fast" x="470" y="200" width="150" height="32" rx="8"/>
  <text class="s" x="545" y="221" text-anchor="middle">coincide una regla: decide solo</text>

  <!-- Botones -->
  <rect class="ok" x="565" y="268" width="100" height="30" rx="8"/><text class="btn" x="615" y="288" text-anchor="middle" style="fill:#4cc38a">Aprobar</text>
  <rect class="no" x="675" y="268" width="100" height="30" rx="8"/><text class="btn" x="725" y="288" text-anchor="middle" style="fill:#ff7b7b">Rechazar</text>
  <path class="arrow" d="M635 170 V268" stroke-dasharray="3 4"/>

  <text class="s" x="20" y="250">Modo «Terminal nativa»: el hook solo avisa y el diálogo sale en la terminal, como siempre.</text>
  <text class="s" x="20" y="270">Modo «Bandeja»: lo que Claude pediría aprobar llega aquí; el diálogo nativo no aparece.</text>
  <text class="s" x="20" y="300">Nunca se usa --dangerously-skip-permissions ni bypassPermissions.</text>

  <circle r="6" fill="#d77757"><animateMotion dur="10s" repeatCount="indefinite" path="M95 115 H270 H450 H635 H810" keyTimes="0;1" calcMode="linear"/></circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">Cómo trabaja una misión con coordinador</title>
  <desc id="d">El coordinador crea tareas dirigidas; los trabajadores las reclaman, trabajan en su rama, hacen commit y las completan; el coordinador integra las ramas y publica el resultado final. Un despertador avisa a los agentes inactivos con trabajo pendiente.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d7dae0; }
    .bg { fill: #0e0f12; }
    .box { fill: #16181d; stroke: #3a3e48; stroke-width: 1.5; }
    .coord { fill: #1b1d24; stroke: #d77757; stroke-width: 2; }
    .res { fill: #14201a; stroke: #4cc38a; stroke-width: 2; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #8a90a0; }
    .line { fill: none; stroke: #3a3e48; stroke-width: 2; }
    .tag { font-size: 11.5px; fill: #e0b252; }
    .task { fill: #23262e; stroke: #3a3e48; }
    .done { animation: done 12s infinite; }
    .claim { animation: claim 12s infinite; }
    @keyframes claim { 0%, 22% { fill: #23262e; stroke: #3a3e48; } 28%, 100% { fill: #2f2916; stroke: #e0b252; } }
    @keyframes done { 0%, 62% { fill: #23262e; stroke: #3a3e48; } 68%, 100% { fill: #14201a; stroke: #4cc38a; } }
    @keyframes wake { 0%, 100% { opacity: .25; } 40%, 60% { opacity: 1; } }
    .wake { animation: wake 4s ease-in-out infinite; }
    @keyframes show { 0%, 80% { opacity: .25; } 88%, 100% { opacity: 1; } }
    .final { animation: show 12s infinite; }
  </style>
  <rect class="bg" width="900" height="440" rx="14"/>

  <!-- Coordinador -->
  <rect class="coord" x="24" y="150" width="190" height="130" rx="14"/>
  <text class="h" x="119" y="184" text-anchor="middle">Coordinador</text>
  <text class="s" x="119" y="206" text-anchor="middle">crea y reparte tareas</text>
  <text class="s" x="119" y="226" text-anchor="middle">vigila, integra ramas</text>
  <text class="s" x="119" y="246" text-anchor="middle">publica el resultado</text>

  <!-- Tareas -->
  <rect class="box" x="300" y="70" width="210" height="300" rx="14"/>
  <text class="h" x="405" y="98" text-anchor="middle">Lista de tareas</text>
  <rect class="task claim" x="318" y="118" width="174" height="46" rx="8"/>
  <text class="s" x="405" y="146" text-anchor="middle" style="fill:#d7dae0">#1 para Rol A</text>
  <rect class="task claim" x="318" y="178" width="174" height="46" rx="8" style="animation-delay:.6s"/>
  <text class="s" x="405" y="206" text-anchor="middle" style="fill:#d7dae0">#2 para Rol B</text>
  <rect class="task claim" x="318" y="238" width="174" height="46" rx="8" style="animation-delay:1.2s"/>
  <text class="s" x="405" y="266" text-anchor="middle" style="fill:#d7dae0">#3 para Rol C</text>
  <text class="tag" x="405" y="318" text-anchor="middle">pendiente → en curso → hecha</text>
  <text class="s" x="405" y="340" text-anchor="middle">claim_task · complete_task</text>

  <!-- Trabajadores -->
  <rect class="box" x="600" y="60" width="150" height="80" rx="12"/>
  <text class="h" x="675" y="92" text-anchor="middle">Rol A</text><text class="s" x="675" y="114" text-anchor="middle">worktree + rama</text>
  <rect class="box" x="600" y="170" width="150" height="80" rx="12"/>
  <text class="h" x="675" y="202" text-anchor="middle">Rol B</text><text class="s" x="675" y="224" text-anchor="middle">worktree + rama</text>
  <rect class="box" x="600" y="280" width="150" height="80" rx="12"/>
  <text class="h" x="675" y="312" text-anchor="middle">Rol C</text><text class="s" x="675" y="334" text-anchor="middle">worktree + rama</text>

  <!-- Resultado -->
  <rect class="res final" x="790" y="150" width="96" height="130" rx="12"/>
  <text class="h final" x="838" y="206" text-anchor="middle">Resultado</text>
  <text class="h final" x="838" y="226" text-anchor="middle">final</text>

  <!-- Caminos -->
  <path id="p1" class="line" d="M214 215 H300"/>
  <path id="p2" class="line" d="M510 140 H600"/>
  <path id="p3" class="line" d="M510 215 H600"/>
  <path id="p4" class="line" d="M510 300 H600"/>
  <path id="p5" class="line" d="M750 215 H790"/>

  <!-- 1 crear tareas -->
  <circle r="5" fill="#d77757"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.12;1" calcMode="linear"><mpath href="#p1"/></animateMotion></circle>
  <!-- 2 reclamar -->
  <circle r="5" fill="#e0b252"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.18;.3;1" calcMode="linear"><mpath href="#p2"/></animateMotion></circle>
  <circle r="5" fill="#e0b252"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.2;.32;1" calcMode="linear"><mpath href="#p3"/></animateMotion></circle>
  <circle r="5" fill="#e0b252"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.22;.34;1" calcMode="linear"><mpath href="#p4"/></animateMotion></circle>
  <!-- 3 completar (vuelven) -->
  <circle r="5" fill="#4cc38a"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="1;1;0;0" keyTimes="0;.55;.7;1" calcMode="linear"><mpath href="#p2"/></animateMotion></circle>
  <circle r="5" fill="#4cc38a"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="1;1;0;0" keyTimes="0;.57;.72;1" calcMode="linear"><mpath href="#p3"/></animateMotion></circle>
  <circle r="5" fill="#4cc38a"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="1;1;0;0" keyTimes="0;.59;.74;1" calcMode="linear"><mpath href="#p4"/></animateMotion></circle>
  <!-- 4 resultado -->
  <circle r="6" fill="#4cc38a"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.78;.9;1" calcMode="linear" path="M214 215 H790"/></circle>

  <!-- Despertador -->
  <text class="tag wake" x="675" y="392" text-anchor="middle">⏰ despertador: avisa a un agente inactivo</text>
  <text class="tag wake" x="675" y="410" text-anchor="middle">con mensajes o tareas pendientes</text>

  <!-- Leyenda -->
  <circle cx="30" cy="392" r="5" fill="#d77757"/><text class="s" x="42" y="396">create_task</text>
  <circle cx="130" cy="392" r="5" fill="#e0b252"/><text class="s" x="142" y="396">claim_task</text>
  <circle cx="230" cy="392" r="5" fill="#4cc38a"/><text class="s" x="242" y="396">complete_task + commit</text>
  <text class="s" x="30" y="420">El coordinador fusiona las ramas, escribe RESULTADO.md y llama a publish_result.</text>
</svg>
